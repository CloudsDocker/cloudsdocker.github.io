[project]
name = "video-gen"
version = "0.1.0"
description = "AI-powered video generation from blog posts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "diffusers>=0.26.0",
    "transformers>=4.36.0",
    "safetensors>=0.4.0",
    "accelerate>=0.26.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]
