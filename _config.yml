# Brand profile
#   personal: Todd Zhang's professional blog look (clean home, blue accent, English only by default)
#   company:  the original Highly Distinguish look (neon AI home, paper theme)
# To switch back to the company look, set `brand: company` and swap in the
# commented company title/subtitle/description below.
brand: personal

# Site settings
title: Todd Zhang — Notes on AI in Production
masthead_title: Todd Zhang   # keeps the top-left header clean; `title` drives the browser tab / SEO
subtitle: "Engineering notes on AI systems, data platforms & cloud"
email: phray.zhang@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Hands-on engineering notes on shipping AI systems, data platforms and cloud
  infrastructure to production.
# Company brand values (use with `brand: company`):
# title: Highly Distinguish
# subtitle: "IT solution & education"
# description: >-
#   Highly Distinguish pty. ltd.

# Posts shown first on the home page and /posts/:
# `pinned: true` posts, then posts tagged with any of ai_tags (case-insensitive), newest first.
featured:
  ai_tags: [ai, llm, rag, agents, agent, genai, machine-learning, deep-learning, nlp, mcp, llmops, llm-gateway, fde, forward-deployed]
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://todzhang.com"
twitter_username: CloudsDocker
github_username: CloudsDocker
repository: CloudsDocker/cloudsdocker.github.io
google_analytics: G-MP843S92NP

# Theme settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "paper"
teaser: /assets/images/Todd_Stamp_Logo.png

# Site configuration
locale: "en-US"
search: true
search_full_content: true

# Add explicit permalink structure
permalink: /:categories/:title/

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "UA-96218029-2"
    anonymize_ip: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-include-cache  
  - jekyll-sitemap
  - jekyll-seo-tag
  

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - raw/
  - blog_business/
  - video_gen/
  - LessChoice/
  - "*.bat"
  - "*.ps1"
  - "*.sh"
  - LOCAL_SETUP_GUIDE.md
  - MODERN_UPGRADE_GUIDE.md

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: modern-single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true
      lang: en
  # Chinese posts: anything named *-zh.md is tagged automatically,
  # other Chinese posts set `lang: zh` in their own front matter
  - scope:
      path: "_posts/**/*-zh.md"
      type: posts
    values:
      lang: zh