- 人不过是夏天午后一片绿叶飘入池塘，水面泛起的一圈波纹，那些腐烂的草叶裹挟着我的呼吸，看清淤泥里漂浮的藻类，正是我这些年亲手掐灭的发着灵光的渴望，人的一生会经历许多痛苦，但回头想想都是传奇，只要心中有光，即使身处泥潭也终会迎来曙光。
- 走大道，大道人少
- 鸟儿在天空飞过时，是不会在乎地面上的栅栏的
- 改变人生的东西，不会以你熟悉的样子出现。
- 黄金，不会埋在人人路过的地方。
- 维特根斯坦在《逻辑哲学论》中写过一句话：凡是可以说的，都可以清楚地说；凡是不能说的，就应该沉默。
- 克尔凯郭尔说：“人必须先跳，意义方能随行。”
- 改变温度很难，但是改变温度计就容易多了，改变体重很难，但是改变体重秤就简单多了
- 李宗盛拍过一段广告：“时过境迁终于明白，人一生中每一个经历过的城市都是相通的，每一个努力过的脚印都是相连的。它一步一步带我到今天，成就今天的我。人生没有白走的路，每一步都算数。”
- 自古入门休问荣枯事，观着容颜便得知。
- 别把孩子和洗澡水一起倒掉
- 我唯一知道的就是自己一无所知。 ——苏格拉底（Socrates）
- 我生来一无所知，只有一点儿时间四处奔波试图改变这一点。 ——理查德·费曼（Richard Feynman）
- 君子之过也，如日月之食焉：过也，人皆见之；更也，人皆仰之。
- 子曰："父在，观其志，父没，观其行，三年无改于父之道，可谓孝矣。" 父亲在世时，因为什么事都是父亲说了算，所以看不出子女的行为。这时候就观察子女的志向。父亲去世后，子女做了家长，大小事情，都由子女说了算，这时候观察子女的行为。如果过了三年，子女都没有改变父亲生前的行为，而是一以贯之，那就是孝子了。
