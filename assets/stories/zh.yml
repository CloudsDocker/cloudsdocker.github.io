- title: 道理与故事：这真是美好的一天，而我却看不见
  story: '我曾经看过一个故事。

    一个失明的老人坐在一栋大厦的台阶边乞讨，旁边的纸板上面写着：“我是个盲人，请帮帮我。”

    他是那么可怜，可是路过的人却很少回应他。

    一个漂亮女孩子从他旁边走过，突然回身，把老盲人的纸板翻过来，唰唰写下了一行字，然后离开。

    奇迹发生了——人们纷纷把硬币放到老人跟前。

    长日将尽，女孩再次路过，老人摸到熟悉的鞋子，问她：“你在我的纸板上写了什么？”

    女孩答：“同样的话，只是用了不同的语言。”

    她写的是：“这真是美好的一天，而我却看不见。”

    在我看来，“我是个盲人，请帮帮我”是道理。而这个聪明女孩写的——是故事。


    （摘自《故事课》：“让他们去讲道理，我们来说故事。”）'
- title: 牛顿 vs 拉格朗日：微观包工头与大局观老板（最小作用量原理与降维打击）
  story: |
    想象你要预测一个球沿着过山车轨道滚下来的轨迹。

    **牛顿的解法：苦逼的“微观包工头”**

    * 你必须盯着这个球的每一个瞬间。
    * 你需要画出它受到的重力、轨道的支持力、摩擦力，并且把这些力全部拆解到 X 轴和 Y 轴上。
    * 最让人抓狂的是，因为过山车轨道是弯曲的，那个“支持力”的方向每一毫米都在变。你就像一个微观包工头，必须死死盯住每一个细节，算错一个角度，整道题就全错了。

    **拉格朗日的解法：聪明的“大局观老板”**

    * 拉格朗日根本不关心球每一秒到底受了什么方向的力，他甚至不画受力分析图。他只看两个宏观指标：**动能**（跑得多快，记作 $T$）和**势能**（在什么高度，记作 $V$）。
    * 他把这两个能量相减，创造了一个终极指标——拉格朗日量：

    $$L = T - V$$

    * 接着，他利用了宇宙里最酷的一条潜规则：**大自然极其“懒惰”**（物理学叫“最小作用量原理”）。球从起点到终点有无数种可能的跑法，但大自然一定会自动规划出一条让“总折腾程度”最小的路线。你只要把能量公式套进一个固定的数学方程里，它就会自动吐出球的运动轨迹。

    **为什么这是降维打击？**

    * **消灭了“方向”：** 能量是纯数字（标量），没有方向。你再也不用管什么正交分解、不需要算夹角的正弦余弦了。
    * **无视了“支持力”：** 牛顿力学里最烦的就是轨道的支持力、绳子的拉力。拉格朗日力学直接把这些限制条件当成已知背景，数学公式会自动把它们过滤掉，完全不用算。
    * **坐标系自由（广义坐标）：** 算钟摆运动时，牛顿非要用 $x$ 和 $y$ 两个坐标来算。拉格朗日说：“直接用摆动的角度 $\theta$ 作为一个变量不就完事了吗？”你想用什么物理量当坐标，就能用什么。

    简单来说，牛顿力学是教你怎么通过“力”一步步推导出物体的运动；而拉格朗日力学是直接告诉你，只要知道了系统的“能量配置”，大自然的底层代码就会自动帮你算出那条最优路径。
