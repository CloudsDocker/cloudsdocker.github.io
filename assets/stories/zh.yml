- title：爱迪生
  story：“他把所有想到的耐热材料全部写下来，总共有一千六百种之多。太多了吧？有没有聪明一点的测试方法？
没有，爱迪生一一测试。
当有人问他，为什么你失败了这么多次，还不放弃，这样会不会太浪费时间了？他是这么回答的，不，一点都没有浪费，因为我已经知道哪些材料不适合了。”

m
故事课（套装2册）（“罗辑思维”罗振宇作序盛赞：“让他们去讲道理，我们来说故事。”）
