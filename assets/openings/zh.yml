- category: statistic
  sentence: 今天，并不是虚空中的一个点，它是由86400秒组成的一个实实在在的循环。能搞定今天不发生极端的波动，就能搞定无数个平稳的一周；能搞定每一个安稳的一天，你自然就赚到了一个健康、从容的今生。
- category: quote
  sentence: 世界是高度复杂的，历史是零散而模糊的。正如托尔斯泰在《安娜·卡列尼娜》开篇写下的那句——「幸福的家庭都是相似的，不幸的家庭各有各的不幸。」
- category: story
  sentence: 1998年，塞利格曼历史性地以最高票当选美国心理协会（APA）的主席。当选后的两个星期内，他一直在准备任职致辞。闲暇之余，他来到自己的玫瑰花园，收拾被忽视了一段时间的玫瑰花。他5岁的小女儿妮基也来到花园玩耍，不时把爸爸正在准备播种的玫瑰花籽扔到空中，引起爸爸的愤怒，受到大声的呵斥。妮基一言不发地慢慢走开，过了一会儿，小姑娘回来郑重地说：“爸爸，我得和你好好谈一谈。”爸爸不解地望着自己的女儿。妮基说：“您可能还记得，从3岁到5岁，我一直是个爱哭的孩子，但是在我5岁生日的时候，我决定再也不哭了，我可以改掉爱哭的习惯，我觉得爸爸你也可以改改爱发脾气的习惯。”女儿的一席话让塞利格曼感到震撼。多年来，塞利格曼一直在研究动物的无助和人类的抑郁。正如5岁的妮基所注意到的那样，这些工作使他变得阴郁、不耐烦和挑剔。塞利格曼开始反省，如果他研究的是幸福而不是不幸，是成就而不是失败，是力量而不是疾病，是不是会对他、他的孩子，甚至对他的患者有完全不同的影响呢？
